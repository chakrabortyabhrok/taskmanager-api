<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Header & Primary Actions -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight flex items-center gap-3">
                    <i class="fas fa-list-check text-blue-500"></i> Task Manager
                </h1>
                <p class="text-slate-400 text-sm mt-1">Django REST Framework API Interface</p>
            </div>
            <button onclick="openModal('create')" 
                    class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2.5 rounded-xl flex items-center gap-2 transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                <i class="fas fa-plus text-xs"></i>
                <span>Create Task</span>
            </button>
        </header>

        <!-- Dynamic Quick Stats Dashboard -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Tasks</p>
                    <h2 id="statTotal" class="text-2xl font-bold text-white mt-1">0</h2>
                </div>
                <div class="p-3 bg-slate-800 text-blue-400 rounded-xl"><i class="fas fa-tasks text-lg"></i></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">To Do</p>
                    <h2 id="statTodo" class="text-2xl font-bold text-blue-400 mt-1">0</h2>
                </div>
                <div class="p-3 bg-blue-950/50 text-blue-400 rounded-xl"><i class="fas fa-clock text-lg"></i></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">In Progress</p>
                    <h2 id="statInProgress" class="text-2xl font-bold text-amber-400 mt-1">0</h2>
                </div>
                <div class="p-3 bg-amber-950/50 text-amber-400 rounded-xl"><i class="fas fa-spinner text-lg"></i></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Completed</p>
                    <h2 id="statDone" class="text-2xl font-bold text-emerald-400 mt-1">0</h2>
                </div>
                <div class="p-3 bg-emerald-950/50 text-emerald-400 rounded-xl"><i class="fas fa-check-circle text-lg"></i></div>
            </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center shadow-sm">
            
            <div class="flex-1 relative">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search tasks by title..." onkeyup="debounceSearch()"
                       class="w-full bg-slate-800 border border-slate-700 text-slate-200 placeholder-slate-500 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <div class="flex flex-wrap gap-3 items-center">
                <!-- Status Filter -->
                <select id="statusFilter" onchange="filterTasks()" 
                        class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Statuses</option>
                    <option value="todo">To Do</option>
                    <option value="in_progress">In Progress</option>
                    <option value="done">Done</option>
                </select>

                <!-- Category Filter -->
                <input type="text" id="categoryFilter" placeholder="Filter category..." onkeyup="filterTasks()" 
                       class="bg-slate-800 border border-slate-700 text-slate-200 text-sm placeholder-slate-500 rounded-xl px-3 py-2 w-36 focus:outline-none focus:ring-2 focus:ring-blue-500">

                <!-- Refresh Button -->
                <button onclick="loadTasks(currentPage)" title="Refresh Tasks"
                        class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 p-2.5 rounded-xl transition-colors">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <!-- Tasks Grid Container -->
        <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Dynamic Cards Loaded via JS -->
        </div>

        <!-- Pagination Bar -->
        <div id="paginationContainer" class="flex justify-center items-center gap-3 pt-4"></div>

    </div>

    <!-- Unified Task Modal (Create & Edit) -->
    <div id="taskModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl transform transition-all">
            
            <div class="flex justify-between items-center px-6 py-4 border-b border-slate-800">
                <h3 id="modalTitle" class="text-lg font-bold text-white">Create New Task</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Task Title *</label>
                    <input type="text" id="taskTitle" placeholder="What needs to be done?" 
                           class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Description</label>
                    <textarea id="taskDescription" rows="3" placeholder="Add extra details or instructions..." 
                              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Status</label>
                        <select id="taskStatus" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="todo">To Do</option>
                            <option value="in_progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Category</label>
                        <input type="text" id="taskCategory" placeholder="e.g. Work" 
                               class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Due Date</label>
                        <input type="date" id="taskDueDate" 
                               class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-900/50 border-t border-slate-800 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors">Cancel</button>
                <button onclick="saveTask()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all shadow-lg shadow-blue-600/20">Save Task</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        const API_BASE = window.location.origin + "/api";
        let currentPage = 1;
        let searchTimeout = null;

        // --- Toast Notification Engine ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const isSuccess = type === 'success';
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border text-sm font-medium shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 ${
                isSuccess 
                ? 'bg-emerald-950/90 border-emerald-800 text-emerald-200' 
                : 'bg-rose-950/90 border-rose-800 text-rose-200'
            }`;
            
            toast.innerHTML = `
                <i class="fas ${isSuccess ? 'fa-check-circle text-emerald-400' : 'fa-exclamation-circle text-rose-400'}"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Skeleton Loading Visual State ---
        function showSkeletons() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = Array(6).fill(0).map(() => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 animate-pulse">
                    <div class="flex justify-between items-center">
                        <div class="h-5 bg-slate-800 rounded w-2/3"></div>
                        <div class="h-5 bg-slate-800 rounded-full w-16"></div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 bg-slate-800 rounded w-full"></div>
                        <div class="h-3 bg-slate-800 rounded w-4/5"></div>
                    </div>
                    <div class="flex justify-between items-center pt-2">
                        <div class="h-4 bg-slate-800 rounded w-1/3"></div>
                        <div class="h-6 bg-slate-800 rounded w-12"></div>
                    </div>
                </div>
            `).join('');
        }

        // --- Fetch & Load Tasks ---
        async function loadTasks(page = 1) {
            currentPage = page;
            showSkeletons();

            const status = document.getElementById('statusFilter').value;
            const category = document.getElementById('categoryFilter').value.trim();
            const search = document.getElementById('searchInput').value.trim();

            let queryParams = [`page=${page}`];
            if (status) queryParams.push(`status=${status}`);
            if (category) queryParams.push(`category=${encodeURIComponent(category)}`);
            if (search) queryParams.push(`search=${encodeURIComponent(search)}`);

            try {
                const res = await fetch(`${API_BASE}/tasks/?${queryParams.join('&')}`);
                if (!res.ok) throw new Error('Network response was not ok');
                
                const data = await res.json();
                const tasks = data.results || data;
                
                renderTasks(tasks);
                renderPagination(data);
                updateStats(tasks);
            } catch (error) {
                document.getElementById('tasksContainer').innerHTML = `
                    <div class="col-span-full py-12 text-center text-rose-400 bg-slate-900/50 border border-slate-800 rounded-2xl">
                        <i class="fas fa-exclamation-triangle text-3xl mb-2"></i>
                        <p>Failed to connect to Django API backend</p>
                    </div>`;
            }
        }

        // --- Render Task Cards ---
        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500 bg-slate-900/30 border border-slate-800 border-dashed rounded-2xl">
                        <i class="fas fa-inbox text-4xl mb-3 text-slate-600"></i>
                        <p class="text-base font-medium">No tasks found</p>
                    </div>`;
                return;
            }

            tasks.forEach(task => {
                const badgeStyle = getStatusBadgeStyle(task.status);
                const formattedDate = task.due_date ? new Date(task.due_date).toLocaleDateString() : null;

                const card = document.createElement('div');
                card.className = `group bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-5 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-200 flex flex-col justify-between`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <h3 class="font-bold text-slate-100 text-base leading-snug group-hover:text-blue-400 transition-colors">${escapeHtml(task.title)}</h3>
                            <button onclick="cycleTaskStatus(${task.id}, '${task.status}')" title="Click to change status" 
                                    class="px-2.5 py-1 text-xs font-semibold rounded-full border ${badgeStyle} hover:scale-105 transition-transform flex items-center gap-1.5 whitespace-nowrap">
                                <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
                                ${formatStatus(task.status)}
                            </button>
                        </div>
                        
                        <p class="text-sm text-slate-400 line-clamp-3 mb-4 leading-relaxed">
                            ${escapeHtml(task.description) || '<span class="italic text-slate-600">No description provided</span>'}
                        </p>
                    </div>

                    <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                        <div class="flex items-center gap-3 overflow-hidden">
                            ${task.category ? `<span class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md font-medium truncate"><i class="fas fa-tag text-[10px] mr-1 text-slate-500"></i>${escapeHtml(task.category)}</span>` : ''}
                            ${formattedDate ? `<span class="text-slate-400"><i class="far fa-calendar mr-1 text-slate-500"></i>${formattedDate}</span>` : ''}
                        </div>
                        
                        <div class="flex items-center gap-1">
                            <button onclick="openModal('edit', ${JSON.stringify(task).replace(/"/g, '&quot;')})" 
                                    class="text-slate-400 hover:text-blue-400 p-1.5 rounded-lg hover:bg-slate-800 transition-colors">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button onclick="deleteTask(${task.id})" 
                                    class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800 transition-colors">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Status Badge Styling Helper ---
        function getStatusBadgeStyle(status) {
            switch(status) {
                case 'done': return 'bg-emerald-950/50 border-emerald-800/80 text-emerald-400';
                case 'in_progress': return 'bg-amber-950/50 border-amber-800/80 text-amber-400';
                default: return 'bg-blue-950/50 border-blue-800/80 text-blue-400';
            }
        }

        function formatStatus(status) {
            if (status === 'in_progress') return 'In Progress';
            return status ? status.charAt(0).toUpperCase() + status.slice(1) : 'To Do';
        }

        // --- Quick Cycle Status (Clicking status badge) ---
        async function cycleTaskStatus(taskId, currentStatus) {
            const nextStatusMap = { 'todo': 'in_progress', 'in_progress': 'done', 'done': 'todo' };
            const newStatus = nextStatusMap[currentStatus] || 'todo';

            try {
                const res = await fetch(`${API_BASE}/tasks/${taskId}/`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.ok) {
                    showToast(`Status updated to ${formatStatus(newStatus)}`);
                    loadTasks(currentPage);
                }
            } catch (err) {
                showToast('Failed to update status', 'error');
            }
        }

        // --- Dynamic Stats Counter ---
        function updateStats(tasks) {
            if (!Array.isArray(tasks)) return;
            document.getElementById('statTotal').innerText = tasks.length;
            document.getElementById('statTodo').innerText = tasks.filter(t => t.status === 'todo').length;
            document.getElementById('statInProgress').innerText = tasks.filter(t => t.status === 'in_progress').length;
            document.getElementById('statDone').innerText = tasks.filter(t => t.status === 'done').length;
        }

        // --- Pagination Bar ---
        function renderPagination(data) {
            const container = document.getElementById('paginationContainer');
            if (!data.next && !data.previous) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <button onclick="loadTasks(${currentPage - 1})" ${!data.previous ? 'disabled' : ''} 
                        class="px-4 py-2 bg-slate-900 border border-slate-800 disabled:opacity-40 hover:bg-slate-800 rounded-xl text-sm font-medium transition-colors">
                    <i class="fas fa-chevron-left mr-1"></i> Prev
                </button>
                <span class="text-sm text-slate-400 px-3">Page ${currentPage}</span>
                <button onclick="loadTasks(${currentPage + 1})" ${!data.next ? 'disabled' : ''} 
                        class="px-4 py-2 bg-slate-900 border border-slate-800 disabled:opacity-40 hover:bg-slate-800 rounded-xl text-sm font-medium transition-colors">
                    Next <i class="fas fa-chevron-right ml-1"></i>
                </button>
            `;
        }

        // --- Debounced Search & Filtering ---
        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => filterTasks(), 300);
        }

        function filterTasks() {
            loadTasks(1);
        }

        // --- Unified Modal Handling ---
        function openModal(mode, task = null) {
            const modal = document.getElementById('taskModal');
            document.getElementById('modalTitle').innerText = mode === 'edit' ? 'Edit Task' : 'Create New Task';
            
            if (mode === 'edit' && task) {
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title || '';
                document.getElementById('taskDescription').value = task.description || '';
                document.getElementById('taskStatus').value = task.status || 'todo';
                document.getElementById('taskCategory').value = task.category || '';
                document.getElementById('taskDueDate').value = task.due_date || '';
            } else {
                document.getElementById('taskId').value = '';
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDescription').value = '';
                document.getElementById('taskStatus').value = 'todo';
                document.getElementById('taskCategory').value = '';
                document.getElementById('taskDueDate').value = '';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        // --- Create / Edit Task Request ---
        async function saveTask() {
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const status = document.getElementById('taskStatus').value;
            const category = document.getElementById('taskCategory').value.trim();
            const due_date = document.getElementById('taskDueDate').value;

            if (!title) {
                showToast("Task title is required", "error");
                return;
            }

            const payload = { title, description, status, category: category || null };
            if (due_date) payload.due_date = due_date;

            const isEdit = Boolean(id);
            const url = isEdit ? `${API_BASE}/tasks/${id}/` : `${API_BASE}/tasks/`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast(`Task ${isEdit ? 'updated' : 'created'} successfully`);
                    closeModal();
                    loadTasks(currentPage);
                } else {
                    showToast(`Failed to ${isEdit ? 'update' : 'create'} task`, 'error');
                }
            } catch (error) {
                showToast("Server communication error", "error");
            }
        }

        // --- Delete Task Action ---
        async function deleteTask(taskId) {
            if (!confirm("Are you sure you want to delete this task?")) return;

            try {
                const res = await fetch(`${API_BASE}/tasks/${taskId}/`, { method: 'DELETE' });

                if (res.ok) {
                    showToast("Task deleted successfully");
                    loadTasks(currentPage);
                } else {
                    showToast("Failed to delete task", "error");
                }
            } catch (error) {
                showToast("Error deleting task", "error");
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- Initialize Page ---
        window.onload = function() {
            loadTasks(1);
        }
    </script>
</body>
</html>
